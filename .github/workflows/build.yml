name: Build & Release XYRecorder APK

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Install CMake
        run: |
          echo "Installing CMake via sdkmanager..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1" 2>&1 || true
          # Also try alternative paths
          yes | $ANDROID_HOME/cmdline-tools/bin/sdkmanager --install "cmake;3.22.1" 2>&1 || true
          ls $ANDROID_HOME/cmake/ 2>/dev/null || echo "CMake not found in SDK"

      - name: Decode Keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "📦 Decoding keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > ${{ github.workspace }}/app/release.keystore
            echo "✅ Keystore decoded successfully"
            ls -la ${{ github.workspace }}/app/release.keystore
          else
            echo "⚠️ No keystore found in secrets"
          fi

      - name: Build Debug APK (Universal)
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK (Universal)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK files
        run: |
          cd app/build/outputs/apk
          if [ -d "debug" ]; then
            cd debug
            for apk in *.apk; do
              mv "$apk" "XYRecorder-${apk%.apk}-universal.apk"
            done
          elif [ -d "release" ]; then
            cd release
            for apk in *.apk; do
              mv "$apk" "XYRecorder-${apk%.apk}-universal.apk"
            done
          fi

      - name: Verify APK Signature (v1/v2/v3/v4)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "🔍 Verifying APK signature..."
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          
          if [ -z "$APK_PATH" ]; then
            echo "❌ No APK found!"
            exit 1
          fi
          
          echo "APK: $APK_PATH"
          echo "Size: $(du -h "$APK_PATH" | cut -f1)"
          echo ""
          
          # Find apksigner from Android SDK build-tools
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 -type d 2>/dev/null | sort -V | tail -1)
          APKSIGNER="$BUILD_TOOLS/apksigner"
          
          echo "=== APK Signature Verification ==="
          echo ""
          
          if [ -f "$APKSIGNER" ]; then
            # Full verbose verification
            "$APKSIGNER" verify --verbose --print-certs "$APK_PATH" 2>&1
            echo ""
          fi
          
          # Check v1 (JAR signing) - look for META-INF/*.SF in APK
          echo "=== Signature Scheme Status ==="
          if unzip -l "$APK_PATH" 2>/dev/null | grep -q "META-INF/.*\.SF"; then
            echo "✅ v1 Signing (JAR): VERIFIED"
          else
            echo "⚠️ v1 Signing (JAR): Not detected"
          fi
          
          # Check v2/v3/v4 using apksigner
          if [ -f "$APKSIGNER" ]; then
            VERIFY_OUTPUT=$("$APKSIGNER" verify --verbose "$APK_PATH" 2>&1)
            
            if echo "$VERIFY_OUTPUT" | grep -q "v1 scheme.*true"; then
              echo "✅ v1 Signing (JAR): VERIFIED (apksigner)"
            fi
            
            if echo "$VERIFY_OUTPUT" | grep -q "v2 scheme.*true"; then
              echo "✅ v2 Signing (APK): VERIFIED"
            else
              echo "⚠️ v2 Signing (APK): Not detected"
            fi
            
            if echo "$VERIFY_OUTPUT" | grep -q "v3 scheme.*true"; then
              echo "✅ v3 Signing (APK): VERIFIED"
            else
              echo "⚠️ v3 Signing (APK): Not detected"
            fi
          fi
          
          # Check v4 (.idsig file)
          IDSIG_PATH="${APK_PATH%.apk}.idsig"
          if [ -f "$IDSIG_PATH" ]; then
            echo "✅ v4 Signing (VERITY): VERIFIED (.idsig file present)"
            ls -la "$IDSIG_PATH"
          else
            echo "ℹ️ v4 Signing (VERITY): No .idsig file"
          fi
          
          echo ""
          echo "=== APK Files ==="
          ls -la app/build/outputs/apk/release/

      - name: Upload Debug APK
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@v4
        with:
          name: XYRecorder-debug-universal
          path: app/build/outputs/apk/debug/*-universal.apk
          retention-days: 30

      - name: Upload Release APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: XYRecorder-release-universal
          path: |
            app/build/outputs/apk/release/*-universal.apk
            app/build/outputs/apk/release/*.idsig
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*-universal.apk
            app/build/outputs/apk/release/*.idsig
          name: XYRecorder ${{ github.ref_name }}
          body: |
            ## 🎙️ XYRecorder ${{ github.ref_name }}
            
            **Professional Audio Recorder with Studio-Quality Mic Processing**
            
            ### 📱 Features
            - 🎤 High-quality 48kHz WAV recording
            - 🎚️ Studio noise reduction with 4 presets (Light / Medium / Heavy / Studio)
            - 📊 Real-time audio level meter
            - 🎨 Beautiful XYVerse dark theme UI
            - 📁 Built-in recordings browser
            
            ### 📦 Universal APK
            This APK supports all architectures:
            - ✅ armeabi-v7a (32-bit ARM - older devices)
            - ✅ arm64-v8a (64-bit ARM - modern devices)
            - ✅ x86 (32-bit Intel - emulators)
            - ✅ x86_64 (64-bit Intel - emulators)
            
            ### 🔐 Signature Verification
            This APK is signed with all signature schemes:
            - ✅ **v1** (JAR signing) - Backward compatibility
            - ✅ **v2** (APK Signature Scheme v2) - Faster installation
            - ✅ **v3** (APK Signature Scheme v3) - Key rotation support
            - ✅ **v4** (VERITY) - Incremental updates
            
            ### 📲 Installation
            1. Download the APK below
            2. Enable "Install from unknown sources" in Android settings
            3. Install the APK
            4. Grant microphone permission
            5. Start recording! 🎙️
            
            ### 🎚️ Audio Processing
            - Native Android NoiseSuppressor
            - Noise gate (threshold-based)
            - Dynamic compression
            - Soft limiting
            - Makeup gain
            - 4 presets: Light → Studio quality
            
            **Requirements:** Android 7.0+ (API 24)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
